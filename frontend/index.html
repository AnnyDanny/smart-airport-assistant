<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Smart Airport Assistant</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <h1>✈ Smart Airport Assistant</h1>
      <p>Enter your flight number</p>
      <input id="flightInput" placeholder="Example: TP757" />
      <button onclick="searchFlight()">Search</button>

      <div class="available-flights">
        <h2>Available Flights</h2>
        <div id="flightList">Loading flights...</div>
      </div>
      <div id="result"></div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
